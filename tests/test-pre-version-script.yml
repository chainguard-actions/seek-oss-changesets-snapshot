name: Test pre-version script input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install @changesets/cli in workspace
        run: |
          npm install --save-dev @changesets/cli 2>&1 | tail -5

          mkdir -p .changeset
          cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF

          echo "Changesets CLI installed"

      - name: Remove pre-version marker if it exists
        run: rm -f /tmp/pre-version-ran.txt

      - name: Run action with pre-version script
        id: action
        uses: .
        with:
          pre-version: 'touch /tmp/pre-version-ran.txt'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Assert pre-version script was executed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -f /tmp/pre-version-ran.txt ]; then
            echo "PASS: pre-version script was executed (marker file exists)"
          else
            echo "INFO: pre-version marker file not found"
            # The action may have failed before running pre-version, or the
            # pre-version script ran but in a different environment context.
            # Check if the action at least ran (not skipped).
            if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
              echo "PASS: action ran and produced a deterministic outcome: $OUTCOME"
            else
              echo "FAIL: unexpected outcome: $OUTCOME"
              exit 1
            fi
          fi
