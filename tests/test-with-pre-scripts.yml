name: Test with pre-publish and pre-version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          pre-publish: echo "pre-publish script executed"
          pre-version: echo "pre-version script executed"
        env:
          GITHUB_TOKEN: fake-github-token
          NPM_TOKEN: fake-npm-token
      - name: Assert action ran (failed at a later stage, not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          # The action should fail (no real NPM/changeset setup), but it should
          # have set the default 'published' output before failing
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real changeset setup), but outcome was '$OUTCOME'"
            exit 1
          fi
          # The published output should be 'false' (set at the very start of the action)
          if [ "$PUBLISHED" != "false" ]; then
            echo "FAIL: expected published output to be 'false', got '$PUBLISHED'"
            exit 1
          fi
          echo "PASS: action accepted pre-publish and pre-version inputs and set default outputs"
