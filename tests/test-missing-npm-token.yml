name: Test missing NPM token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: fake-github-token
          # NPM_TOKEN intentionally omitted
      - name: Assert action failed due to missing NPM token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when NPM_TOKEN is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when NPM_TOKEN was not provided"
