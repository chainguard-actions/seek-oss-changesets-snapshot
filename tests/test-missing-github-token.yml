name: Test missing GITHUB_TOKEN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without GITHUB_TOKEN
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ''
        continue-on-error: true

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_TOKEN is missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_TOKEN is missing"
