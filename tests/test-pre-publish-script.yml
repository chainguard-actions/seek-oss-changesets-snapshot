name: Test pre-publish script input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install @changesets/cli in workspace
        run: |
          npm install --save-dev @changesets/cli 2>&1 | tail -5

          mkdir -p .changeset
          cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF

          echo "Changesets CLI installed"

      - name: Remove pre-publish marker if it exists
        run: rm -f /tmp/pre-publish-ran.txt

      - name: Run action with pre-publish script
        id: action
        uses: .
        with:
          pre-publish: 'touch /tmp/pre-publish-ran.txt'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran and produced a deterministic outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          # The action should run and produce a deterministic outcome.
          # With no changesets, it exits before reaching the publish step,
          # so pre-publish may not run. The action should still succeed or fail cleanly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
