name: Test basic usage - no NPM token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # The action requires a package.json with a detectable package manager.
      # Set up a minimal npm project so package-manager-detector can find npm.
      - name: Set up minimal npm project with changesets
        run: |
          mkdir -p /tmp/test-pkg/.changeset
          cd /tmp/test-pkg
          cat > package.json <<'EOF'
          {
            "name": "test-pkg",
            "version": "1.0.0",
            "private": true
          }
          EOF
          cat > .changeset/config.json <<'EOF'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.0.0/schema.json",
            "changelog": false,
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "restricted",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          EOF
          git init
          git config user.email "test@example.com"
          git config user.name "Test"
          git add .
          git commit -m "init"

      # Run the action from the workspace root (which has pnpm-lock.yaml so pnpm is detected).
      # The action will fail because there is no NPM_TOKEN and no real packages to publish.
      # We allow failure and assert on the outcome.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran and failed gracefully (no NPM_TOKEN / no publishable packages)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded, published must be false (no packages were published)
            if [ "$PUBLISHED" != "false" ]; then
              echo "FAIL: expected published=false but got '$PUBLISHED'"
              exit 1
            fi
            echo "PASS: action succeeded with published=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no NPM_TOKEN or no publishable packages)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
