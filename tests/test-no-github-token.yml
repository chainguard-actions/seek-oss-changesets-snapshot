name: Test - No GitHub Token
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Clear GITHUB_TOKEN for this test
        run: echo "GITHUB_TOKEN=" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ""
          GITHUB_REF: refs/heads/main

      - name: Assert action failed due to missing GITHUB_TOKEN
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_TOKEN is not set, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_TOKEN is missing"
