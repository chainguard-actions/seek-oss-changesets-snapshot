name: Test - Default Outputs Set On Failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ""

      - name: Assert published output defaults to false
        env:
          PUBLISHED: ${{ steps.action.outputs.published }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          # The action sets published=false at the very start before any validation,
          # so even when it fails (due to missing NPM_TOKEN), published should be 'false'
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when NPM_TOKEN is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          if [ "$PUBLISHED" != "false" ]; then
            echo "FAIL: expected published=false but got published=$PUBLISHED"
            exit 1
          fi
          echo "PASS: action failed as expected and published output is 'false'"
