name: Test pre-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # The pre-version script writes a sentinel file so we can verify it ran.
      - name: Prepare sentinel file path
        run: echo "PRE_VERSION_SENTINEL=/tmp/pre-version-ran" >> "$GITHUB_ENV"

      # Run the action with a pre-version script that creates a sentinel file.
      # The action will fail after running pre-version (no NPM_TOKEN / no publishable packages).
      - id: action
        uses: .
        continue-on-error: true
        with:
          pre-version: touch /tmp/pre-version-ran
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert pre-version script ran
        run: |
          echo "Checking for sentinel file at /tmp/pre-version-ran"
          if [ ! -f /tmp/pre-version-ran ]; then
            echo "FAIL: pre-version script did not run (sentinel file not found)"
            exit 1
          fi
          echo "PASS: pre-version script ran successfully"

      - name: Assert action outcome is success or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
