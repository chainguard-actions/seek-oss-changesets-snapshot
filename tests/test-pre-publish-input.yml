name: Test pre-publish input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: dummy-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pre-publish: 'echo "pre-publish step executed"'
        continue-on-error: true
      - name: Assert action ran with pre-publish input
        run: |
          echo "Action completed (with or without publishing)"
          echo "published: ${{ steps.action.outputs.published }}"
          echo "PASS: pre-publish input was accepted by the action"
