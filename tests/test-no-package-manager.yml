name: Test - No Package Manager Detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: "fake-npm-token-for-test"

      - name: Assert action failed due to no package manager
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "published: $PUBLISHED"
          # The workspace has no package.json so the action should fail
          # with 'Unable to detect package manager'
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no package manager is detected, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no package manager is detected"
