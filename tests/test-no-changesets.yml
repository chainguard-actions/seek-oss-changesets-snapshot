name: Test - No Changesets Found (published=false)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: npm install -g pnpm@10.30.1

      - name: Install dependencies (including @changesets/cli)
        run: pnpm install --frozen-lockfile

      - name: Run action (no pending changesets → published=false)
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert published is false
        env:
          PUBLISHED: ${{ steps.action.outputs.published }}
        run: |
          echo "published: $PUBLISHED"
          if [ "$PUBLISHED" = "true" ]; then
            echo "FAIL: expected published=false but got published=true"
            exit 1
          fi
          echo "PASS: published is correctly false (no changesets found)"

      - name: Assert publishedPackages is empty
        env:
          PUBLISHED_PACKAGES: ${{ steps.action.outputs.publishedPackages }}
        run: |
          echo "publishedPackages: $PUBLISHED_PACKAGES"
          # Should be empty array [] or empty string
          NORM="$(echo "$PUBLISHED_PACKAGES" | tr -d '[:space:]')"
          if [ "$NORM" = "[]" ] || [ -z "$NORM" ]; then
            echo "PASS: publishedPackages is empty as expected"
          else
            echo "FAIL: expected empty publishedPackages but got: $PUBLISHED_PACKAGES"
            exit 1
          fi
